<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta id="viewportMeta" name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taters Production Plan</title>
    
    <!-- Dynamic Favicon -->
    <link id="dynamicFavicon" rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/Popcorn_icon.svg/1024px-Popcorn_icon.svg.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Nunito', 'sans-serif'], },
                    colors: {
                        darkBg: '#121212',
                        cardBg: '#1e1e1e',
                        tatersRed: '#d32f2f',
                        tatersOrange: '#f57c00',
                        tatersYellow: '#fbc02d',
                        tatersGreen: '#388e3c'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Nunito', sans-serif; overflow-x: hidden; }
        
        .prod-table { width: 100%; border-collapse: collapse; text-align: center; }
        .prod-table th, .prod-table td { border: 1px solid #404040; padding: 4px; }
        .prod-table th { background-color: #2a2a2a; color: #fff; font-weight: 700; text-transform: uppercase; font-size: 0.8rem; }
        
        .hdr-red { background-color: #d32f2f !important; color: white !important; }
        .hdr-yellow { background-color: #fbc02d !important; color: #000 !important; }
        .hdr-green { background-color: #689f38 !important; color: white !important; }
        .hdr-dark { background-color: #212121 !important; color: white !important; }
        
        .cell-input { width: 100%; min-width: 45px; background: transparent; border: none; text-align: center; color: white; outline: none; font-weight: 600; }
        .cell-input:focus { background: rgba(255, 255, 255, 0.1); }
        .cell-input:disabled { color: #888; cursor: not-allowed; }
        
        .cell-computed { color: #f57c00; font-weight: 800; }
        .variance-good { color: #4ade80; }
        .variance-bad { color: #f87171; }

        .avatar-tiny { width: 16px; height: 16px; border-radius: 50%; position: absolute; bottom: 2px; right: 2px; opacity: 0.8; object-fit: cover; }
        .input-wrapper { position: relative; display: flex; align-items: center; justify-content: center; height: 100%; }

        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e1e1e; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }

        .sticky-col { position: sticky; left: 0; z-index: 20; box-shadow: 2px 0 5px rgba(0,0,0,0.5); }
        .sticky-col-header { position: sticky; left: 0; z-index: 30; box-shadow: 2px 0 5px rgba(0,0,0,0.5); }

        /* Animation for Chat Bubble */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9) translateY(-10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-pop { animation: popIn 0.2s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- LOGIN MODAL -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
        <div class="bg-cardBg p-8 rounded-xl w-full max-w-sm border border-gray-700 shadow-2xl">
            <h2 class="text-2xl font-black mb-6 text-center text-tatersRed">SYSTEM LOGIN</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Name</label>
                    <input type="text" id="loginName" class="w-full bg-darkBg border border-gray-600 rounded p-2 text-white outline-none">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Access Code</label>
                    <input type="password" id="loginCode" class="w-full bg-darkBg border border-gray-600 rounded p-2 text-white outline-none">
                </div>
                <div id="loginError" class="text-red-500 text-sm hidden text-center font-bold">Invalid Name or Code</div>
                <div class="flex gap-2 pt-2">
                    <button onclick="document.getElementById('loginModal').classList.add('hidden')" class="flex-1 bg-gray-600 hover:bg-gray-500 py-2 rounded font-bold">Cancel</button>
                    <button onclick="handleLogin()" class="flex-1 bg-tatersRed hover:bg-red-600 py-2 rounded font-bold text-white">Login</button>
                </div>
            </div>
        </div>
    </div>

    <!-- AUDIT LOGS MODAL -->
    <div id="auditModal" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-2 lg:p-4">
        <div class="bg-cardBg p-4 lg:p-6 rounded-xl w-full max-w-3xl border border-gray-700 shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl lg:text-2xl font-black text-blue-400"><i class="fas fa-history mr-2"></i> System Audit Logs</h2>
                <button onclick="closeAuditModal()" class="text-gray-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="overflow-y-auto flex-1 border border-gray-700 bg-darkBg rounded p-2">
                <table class="w-full text-left text-xs lg:text-sm">
                    <thead class="bg-gray-800 sticky top-0 z-10">
                        <tr>
                            <th class="p-2 border-b border-gray-700 w-1/4">Timestamp</th>
                            <th class="p-2 border-b border-gray-700 w-1/4">User</th>
                            <th class="p-2 border-b border-gray-700 w-1/2">Action Taken</th>
                        </tr>
                    </thead>
                    <tbody id="auditListBody">
                        <!-- Populated via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ADMIN SETTINGS MODAL -->
    <div id="adminModal" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-2 lg:p-4">
        <div class="bg-cardBg p-4 lg:p-6 rounded-xl w-full max-w-5xl border border-gray-700 shadow-2xl flex flex-col max-h-[95vh]">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl lg:text-2xl font-black text-tatersOrange"><i class="fas fa-cogs mr-2"></i> Administrator Settings</h2>
                <button onclick="closeAdminModal()" class="text-gray-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            
            <div class="flex flex-col md:flex-row gap-4 overflow-hidden flex-1">
                <div class="w-full md:w-1/3 flex flex-col gap-4 overflow-y-auto pr-2">
                    <!-- BRAND SETTINGS -->
                    <div class="bg-darkBg p-4 rounded border border-gray-700">
                        <h3 class="font-bold mb-3 text-white border-b border-gray-600 pb-1"><i class="fas fa-image text-tatersOrange"></i> Brand Settings</h3>
                        <div class="space-y-3 text-sm">
                            <div>
                                <label class="text-gray-400 text-xs">Main Logo</label>
                                <div class="flex gap-2 items-center">
                                    <input type="text" id="brandLogoUrl" placeholder="Logo Link" class="flex-1 bg-cardBg border border-gray-600 rounded p-1.5 text-white text-xs" readonly>
                                    <input type="file" id="logoUpload" accept="image/*" class="hidden" onchange="uploadToImgBB(this, 'brandLogoUrl')">
                                    <button onclick="document.getElementById('logoUpload').click()" class="bg-blue-600 hover:bg-blue-500 px-2 py-1 rounded text-white font-bold text-xs"><i class="fas fa-upload"></i></button>
                                </div>
                            </div>
                            <div>
                                <label class="text-gray-400 text-xs">Favicon</label>
                                <div class="flex gap-2 items-center">
                                    <input type="text" id="brandFaviconUrl" placeholder="Favicon Link" class="flex-1 bg-cardBg border border-gray-600 rounded p-1.5 text-white text-xs" readonly>
                                    <input type="file" id="faviconUpload" accept="image/*" class="hidden" onchange="uploadToImgBB(this, 'brandFaviconUrl')">
                                    <button onclick="document.getElementById('faviconUpload').click()" class="bg-blue-600 hover:bg-blue-500 px-2 py-1 rounded text-white font-bold text-xs"><i class="fas fa-upload"></i></button>
                                </div>
                            </div>
                            <button onclick="saveBrandSettings()" class="w-full bg-tatersOrange hover:bg-orange-600 py-1.5 rounded font-bold text-white text-xs shadow-md mt-2">Save Brand Settings</button>
                        </div>
                    </div>

                    <!-- USER FORM -->
                    <div class="bg-darkBg p-4 rounded border border-gray-700">
                        <h3 class="font-bold mb-3 text-white border-b border-gray-600 pb-1" id="userFormTitle"><i class="fas fa-user-plus text-tatersGreen"></i> Add / Edit User</h3>
                        <input type="hidden" id="editOldCode">
                        <div class="space-y-3 text-sm">
                            <div>
                                <label class="text-gray-400 text-xs">Name</label>
                                <input type="text" id="uName" class="w-full bg-cardBg border border-gray-600 rounded p-1.5 text-white">
                            </div>
                            <div>
                                <label class="text-gray-400 text-xs">Access Code</label>
                                <input type="text" id="uCode" class="w-full bg-cardBg border border-gray-600 rounded p-1.5 text-white">
                            </div>
                            <div>
                                <label class="text-gray-400 text-xs">Role</label>
                                <select id="uRole" class="w-full bg-cardBg border border-gray-600 rounded p-1.5 text-white">
                                    <option value="staff">Staff</option>
                                    <option value="tc">Team Captain</option>
                                    <option value="admin">Administrator</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-gray-400 text-xs">Avatar</label>
                                <div class="flex gap-2 items-center">
                                    <input type="text" id="uAvatar" placeholder="Image Link" class="flex-1 bg-cardBg border border-gray-600 rounded p-1.5 text-white text-xs" readonly>
                                    <input type="file" id="imgUpload" accept="image/*" class="hidden" onchange="uploadToImgBB(this, 'uAvatar')">
                                    <button onclick="document.getElementById('imgUpload').click()" class="bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded text-white font-bold text-xs whitespace-nowrap"><i class="fas fa-upload"></i></button>
                                </div>
                            </div>
                            <div class="pt-2 flex gap-2">
                                <button onclick="clearUserForm()" class="flex-1 bg-gray-700 hover:bg-gray-600 py-1.5 rounded font-bold text-white text-xs">Clear</button>
                                <button onclick="saveUser()" class="flex-1 bg-tatersGreen hover:bg-green-600 py-1.5 rounded font-bold text-white text-xs shadow-md">Save User</button>
                            </div>
                        </div>
                    </div>
                    <div id="uploadStatus" class="text-xs font-bold text-center hidden"></div>
                </div>

                <div class="w-full md:w-2/3 overflow-y-auto border border-gray-700 rounded bg-darkBg">
                    <table class="w-full text-left text-xs lg:text-sm">
                        <thead class="bg-gray-800 sticky top-0 z-10">
                            <tr>
                                <th class="p-2 border-b border-gray-700">Pic</th>
                                <th class="p-2 border-b border-gray-700">Name</th>
                                <th class="p-2 border-b border-gray-700">Role</th>
                                <th class="p-2 border-b border-gray-700">Code</th>
                                <th class="p-2 border-b border-gray-700 text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="userListBody" class="bg-darkBg"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header class="bg-cardBg border-b border-gray-800 p-4 flex flex-col md:flex-row gap-4 justify-between md:items-center shadow-md">
        <!-- Left Area -->
        <div class="flex flex-wrap items-center gap-3">
            <h1 class="text-xl lg:text-2xl font-black text-tatersRed tracking-wider uppercase flex items-center gap-2">
                <img id="mainAppLogo" src="" class="h-8 hidden object-contain rounded" alt="Logo">
                <span id="mainAppText">Taters Production Plan</span>
            </h1>
            
            <div class="relative z-40">
                <button onclick="toggleDropdown()" class="bg-darkBg border border-gray-700 px-3 py-1.5 rounded font-bold flex items-center gap-2 hover:bg-gray-800 transition text-sm">
                    <span id="currentCatLabel">🍿 POPCORN</span>
                    <i class="fas fa-chevron-down text-xs"></i>
                </button>
                <div id="catDropdown" class="hidden absolute top-full left-0 mt-1 w-64 bg-cardBg border border-gray-700 rounded shadow-xl overflow-hidden">
                    <button onclick="selectCategory('popcorn')" class="w-full text-left px-4 py-3 hover:bg-darkBg font-bold text-sm border-b border-gray-800">🍿 POPCORN</button>
                    <button onclick="selectCategory('cornachos')" class="w-full text-left px-4 py-3 hover:bg-darkBg font-bold text-sm border-b border-gray-800">🧀 YELLOW CORNACHOS</button>
                    <button onclick="selectCategory('juices')" class="w-full text-left px-4 py-3 hover:bg-darkBg font-bold text-sm border-b border-gray-800">🧃 JUICES</button>
                    <button onclick="selectCategory('sauces')" class="w-full text-left px-4 py-3 hover:bg-darkBg font-bold text-sm">🥫 SAUCES & TOPPINGS</button>
                </div>
            </div>

            <!-- View Toggle -->
            <button id="viewToggleBtn" onclick="toggleViewMode()" class="bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded text-xs font-bold text-white transition flex items-center gap-1 shadow">
                <i class="fas fa-desktop"></i> <span id="viewToggleText">Desktop View</span>
            </button>
        </div>
        
        <!-- Right Area -->
        <div class="flex flex-wrap items-center gap-3">
            <div class="flex items-center gap-2 bg-darkBg border border-gray-700 px-2 py-1 rounded text-sm">
                <span class="font-bold text-gray-400 text-xs">WEEK OF:</span>
                <input type="date" id="weekSelector" class="bg-transparent text-white outline-none font-bold cursor-pointer" onchange="generateTables()">
            </div>

            <!-- User Profile Section with Clickable Avatar Chat Bubble -->
            <div id="userProfile" class="hidden relative flex items-center gap-2 bg-darkBg px-2 py-1 rounded border border-gray-700 z-50">
                <img id="userAvatar" src="" class="w-7 h-7 rounded-full border-2 border-gray-500 object-cover cursor-pointer hover:border-tatersOrange transition" onclick="toggleUserBubble()" title="Click to view info">
                
                <!-- Chat Bubble (Hidden initially) -->
                <div id="userBubble" class="hidden absolute top-full mt-3 left-1/2 transform -translate-x-1/2 bg-gray-800 border border-gray-600 rounded shadow-2xl p-3 z-50 w-40 text-center animate-pop">
                    <!-- Pointer Triangle -->
                    <div class="absolute -top-2 left-1/2 transform -translate-x-1/2 w-4 h-4 bg-gray-800 border-t border-l border-gray-600 rotate-45"></div>
                    <div class="relative z-10">
                        <div class="font-black text-white text-sm whitespace-nowrap" id="bubbleName">User</div>
                        <div class="text-[10px] uppercase text-tatersOrange font-bold tracking-wider mt-0.5" id="bubbleRole">Role</div>
                    </div>
                </div>

                <div class="flex flex-col hidden sm:flex pointer-events-none">
                    <span id="userName" class="text-xs font-bold leading-tight">User</span>
                    <span id="userRole" class="text-[9px] uppercase text-tatersOrange font-black tracking-wider leading-tight">Role</span>
                </div>
                <button onclick="logout()" class="ml-1 text-gray-400 hover:text-red-500" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
            </div>
            
            <button id="loginBtn" onclick="document.getElementById('loginModal').classList.remove('hidden')" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded text-sm font-bold shadow">
                <i class="fas fa-user mr-1"></i>Login
            </button>

            <!-- Audit Logs Button (Only visible to TC & Admin) -->
            <button id="auditBtn" onclick="openAuditModal()" class="hidden bg-blue-700 hover:bg-blue-600 px-3 py-1.5 rounded text-sm font-bold text-white shadow-lg transition" title="View Audit Logs">
                <i class="fas fa-history"></i>
            </button>

            <!-- Admin Settings Button -->
            <button id="adminBtn" onclick="openAdminModal()" class="hidden bg-purple-700 hover:bg-purple-600 px-3 py-1.5 rounded text-sm font-bold text-white shadow-lg transition" title="Admin Settings">
                <i class="fas fa-cogs"></i>
            </button>
            
            <button onclick="printToNewTab()" class="bg-tatersRed hover:bg-red-700 px-3 py-1.5 rounded text-sm font-bold text-white shadow-lg">
                <i class="fas fa-print"></i> Print
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 overflow-x-auto p-2 lg:p-6 relative flex flex-col">
        <div id="tableContainer" class="flex flex-col gap-6 max-w-[1400px] mx-auto pb-10 w-full"></div>
    </main>
    
    <!-- FOOTER -->
    <footer class="w-full text-center py-4 bg-darkBg border-t border-gray-800 text-gray-500 font-bold text-xs mt-auto">
        Created by Tyler Jarvey Templeton
    </footer>

    <!-- LOGIC SCRIPT -->
    <script type="module">
        // Added 'query' and 'limitToLast' from Firebase Database for the logs query
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, set, remove, push, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ==========================================
        // FIREBASE CONFIG
        // ==========================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            databaseURL: "https://taters-tool-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "YOUR_PROJECT_ID",
            appId: "YOUR_APP_ID"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ==========================================
        // VIEW TOGGLE LOGIC
        // ==========================================
        window.isMobileView = true;
        window.toggleViewMode = function() {
            window.isMobileView = !window.isMobileView;
            const meta = document.getElementById('viewportMeta');
            const btnText = document.getElementById('viewToggleText');
            const btnIcon = document.querySelector('#viewToggleBtn i');

            if(window.isMobileView) {
                meta.setAttribute('content', 'width=device-width, initial-scale=1.0');
                btnText.innerText = 'Desktop View'; 
                btnIcon.className = 'fas fa-desktop';
            } else {
                meta.setAttribute('content', 'width=1300');
                btnText.innerText = 'Mobile View';
                btnIcon.className = 'fas fa-mobile-alt';
            }
        };

        // ==========================================
        // SYSTEM DATA & STATE
        // ==========================================
        window.systemUsers = {}; 
        window.currentUser = null;
        window.currentCategory = 'popcorn';
        
        const today = new Date();
        const firstDay = new Date(today.setDate(today.getDate() - today.getDay() + 1));
        document.getElementById('weekSelector').value = firstDay.toISOString().split('T')[0];
        const daysOfWeek = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

        const schemas = {
            popcorn: { label: '🍿 POPCORN PRODUCTION', title: 'POPCORN PRODUCTION PLAN FORM', titleBg: 'bg-tatersRed text-white', shifts: [{name: '10 - 2', class: 'hdr-red'}, {name: '2 - 6', class: 'hdr-red'}, {name: '6 - 10', class: 'hdr-red'}], items: [{id: 'batches', name: '# OF BATCHES', isMain: true, roundInt: true}, {id: 'wt', name: 'TOTAL WT (0.500g)', roundInt: false, isReadonly: true, planOnly: true}] },
            cornachos: { label: '🧀 YELLOW CORNACHOS', title: 'WARMED YELLOW CORNACHOS PRODUCTION PLAN', titleBg: 'bg-tatersYellow text-blue-900', shifts: [{name: '10 - 2', class: 'hdr-yellow'}, {name: '2 - 6', class: 'hdr-red'}, {name: '6 - 10', class: 'hdr-green'}], items: [{id: 'cornachos', name: 'YELLOW CORNACHOS', isMain: true, roundInt: false}] },
            juices: { label: '🧃 JUICES', title: 'JUICES PRODUCTION PLAN FORM', titleBg: 'bg-tatersRed text-white', shifts: [{name: '10 - 2', class: 'hdr-green'}, {name: '2 - 6', class: 'hdr-green'}, {name: '6 - 10', class: 'hdr-green'}], items: [{id: 'iced_tea', name: 'Iced Tea', isMain: true, roundInt: true}, {id: 'sf_lemonade', name: 'SF Lemonade', isMain: true, roundInt: true}] },
            sauces: { label: '🥫 SAUCES & TOPPINGS', title: 'WARMED SAUCES & TOPPINGS', titleBg: 'bg-gray-800 text-white', shifts: [{name: '10AM - 4PM', class: 'hdr-yellow'}, {name: '4PM - 10PM', class: 'hdr-green'}], items: [{id: 'quezo', name: 'QUEZO DIP'}, {id: 'coney', name: 'CONEY ISLAND'}, {id: 'butter', name: 'BUTTER'}, {id: 'beef', name: 'GROUND BEEF'}, {id: 'sc', name: 'SC DIP'}] }
        };

        const defaultAccounts = {
            'TJ112293120064': { name: 'Tyler', role: 'admin', code: 'TJ112293120064', avatar: 'https://api.dicebear.com/7.x/initials/svg?seed=Tyler&backgroundColor=d32f2f' },
            'vercelynTC': { name: 'Vercelyn', role: 'tc', code: 'vercelynTC', avatar: 'https://api.dicebear.com/7.x/initials/svg?seed=Vercelyn&backgroundColor=f57c00' },
            'staff01': { name: 'Juan Staff', role: 'staff', code: 'staff01', avatar: 'https://api.dicebear.com/7.x/initials/svg?seed=Juan&backgroundColor=388e3c' }
        };
        window.systemUsers = defaultAccounts; 

        try {
            onValue(ref(db, 'users'), (snapshot) => {
                const data = snapshot.val();
                if(data) window.systemUsers = data;
                if(!document.getElementById('adminModal').classList.contains('hidden')) renderUserList();
            });

            onValue(ref(db, 'settings/brand'), (snapshot) => {
                const data = snapshot.val();
                if(data) window.applyBrandSettings(data.logo, data.favicon);
            });
        } catch(e) { console.warn("Local Mode / Firebase Not Configured Properly."); }

        // ==========================================
        // AUTH & UI LOGIC
        // ==========================================
        window.handleLogin = function() {
            const name = document.getElementById('loginName').value.trim();
            const code = document.getElementById('loginCode').value.trim();
            const user = window.systemUsers[code];
            if (user && user.name.toLowerCase() === name.toLowerCase()) {
                window.currentUser = user;
                
                // Hide Login Button / Error Modal
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('loginBtn').classList.add('hidden');
                document.getElementById('loginError').classList.add('hidden');
                
                // Set User Profile Data
                document.getElementById('userProfile').classList.remove('hidden');
                document.getElementById('userName').innerText = user.name;
                document.getElementById('userAvatar').src = user.avatar;
                
                let roleDisplay = user.role === 'tc' ? 'Team Captain' : (user.role === 'admin' ? 'Administrator' : 'Staff');
                document.getElementById('userRole').innerText = roleDisplay;
                
                // Set Chat Bubble Data
                document.getElementById('bubbleName').innerText = user.name;
                document.getElementById('bubbleRole').innerText = roleDisplay;

                // Show Admin & Audit buttons conditionally based on role
                if(user.role === 'admin') document.getElementById('adminBtn').classList.remove('hidden');
                if(user.role === 'admin' || user.role === 'tc') document.getElementById('auditBtn').classList.remove('hidden');
                
                logAudit(`Logged in to system.`);
                window.generateTables(); 
            } else { document.getElementById('loginError').classList.remove('hidden'); }
        };

        window.logout = function() {
            window.currentUser = null;
            document.getElementById('loginBtn').classList.remove('hidden');

        // ==========================================
        // REAL-TIME LOCAL CALCULATION 
        // ==========================================
        window.recalcDay = function(dayName) {
            const schema = schemas[window.currentCategory];
            
            if (window.currentCategory === 'popcorn') {
                const b = document.getElementById(`inp_plan_${dayName}_batches`);
                const w = document.getElementById(`inp_plan_${dayName}_wt`);
                if (b && w) {
                    if (b.value !== "") {
                        w.value = (parseFloat(b.value) * 0.500).toFixed(3).replace(/\.?0+$/, '');
                    } else {
                        w.value = "";
                    }
                }
            }

            let dists = [];
            schema.shifts.forEach((_, i) => { dists.push(parseFloat(document.getElementById(`inp_dist_${dayName}_${i}`)?.value) || 0); });

            schema.items.forEach(item => {
                let planInput = document.getElementById(`inp_plan_${dayName}_${item.id}`);
                let planVal = planInput ? (parseFloat(planInput.value) || 0) : 0; 
                let totalAct = 0;
                
                schema.shifts.forEach((_, i) => {
                    let subPlanEl = document.getElementById(`calc_subplan_${dayName}_${item.id}_${i}`);
                    if(subPlanEl) {
                        let subCalc = (planVal * dists[i]) / 100;
                        if(subCalc > 0) {
                            subPlanEl.innerText = item.roundInt ? Math.round(subCalc) : subCalc.toFixed(3).replace(/\.?0+$/, '');
                        } else { subPlanEl.innerText = ''; } 
                    }
                    if (!item.planOnly) {
                        totalAct += parseFloat(document.getElementById(`inp_act_${dayName}_${item.id}_${i}`)?.value) || 0;
                    }
                });

                if (!item.planOnly) {
                    let begVal = parseFloat(document.getElementById(`inp_beg_${dayName}_${item.id}`)?.value) || 0;
                    let endVal = parseFloat(document.getElementById(`inp_end_${dayName}_${item.id}`)?.value) || 0;
                    
                    const usage = begVal + totalAct - endVal;
                    const variance = planVal - usage;
                    const pctVar = planVal !== 0 ? Math.round((variance / planVal) * 100) : 0;

                    let usgEl = document.getElementById(`calc_usg_${dayName}_${item.id}`);
                    let varEl = document.getElementById(`calc_var_${dayName}_${item.id}`);
                    let pctEl = document.getElementById(`calc_pct_${dayName}_${item.id}`);
                    
                    let anyInputExists = planVal > 0 || begVal > 0 || totalAct > 0 || endVal > 0;

                    if(usgEl) usgEl.innerText = (usage !== 0 || anyInputExists) ? usage.toFixed(2) : '';
                    if(varEl && pctEl) {
                        if (anyInputExists) {
                            varEl.innerText = variance.toFixed(2);
                            pctEl.innerText = `${pctVar}%`;
                            if(variance > 0) {
                                varEl.className = 'bg-gray-900 font-bold variance-good';
                                pctEl.className = 'bg-gray-900 font-bold variance-good';
                            } else if(variance < 0) {
                                varEl.className = 'bg-gray-900 font-bold variance-bad';
                                pctEl.className = 'bg-gray-900 font-bold variance-bad';
                            } else {
                                varEl.className = 'bg-gray-900 font-bold text-gray-500';
                                pctEl.className = 'bg-gray-900 font-bold text-gray-500';
                            }
                        } else {
                            varEl.innerText = ''; pctEl.innerText = '';
                            varEl.className = 'bg-gray-900 font-bold'; pctEl.className = 'bg-gray-900 font-bold';
                        }
                    }
                }
            });
        };

        window.handleInputSave = function(e) {
            if(!window.currentUser) return;
            const input = e.target;
            const val = input.value;
            let fireVal = val === "" ? null : parseFloat(val);

            const { day, type, item, index } = input.dataset;
            const weekId = document.getElementById('weekSelector').value;
            let dbPath = `plans/${weekId}/${window.currentCategory}/${day}`;
            let updates = {};

            if(type === 'dist') {
                updates[`dist_${index}`] = fireVal;
                updates[`dist_${index}_by`] = fireVal !== null ? window.currentUser.avatar : null;
            } else {
                let suffix = index !== undefined ? `_${index}` : '';
                updates[`items/${item}/${type}${suffix}`] = fireVal;
                updates[`items/${item}/${type}${suffix}_by`] = fireVal !== null ? window.currentUser.avatar : null;
                
                if (window.currentCategory === 'popcorn' && item === 'batches' && type === 'plan') {
                    let wtFireVal = fireVal !== null ? parseFloat((fireVal * 0.500).toFixed(3)) : null;
                    updates[`items/wt/${type}${suffix}`] = wtFireVal;
                    updates[`items/wt/${type}${suffix}_by`] = fireVal !== null ? window.currentUser.avatar : null;
                }
            }
            try { update(ref(db, dbPath), updates); logAudit(`Updated [${schemas[window.currentCategory].label}] -> ${day} | ${item || 'Distribution'} | ${type} = ${val}`); } catch(err) {}
        };

        function fetchFirebaseData() {
            const weekId = document.getElementById('weekSelector').value;
            try {
                onValue(ref(db, `plans/${weekId}/${window.currentCategory}`), (snapshot) => {
                    const data = snapshot.val() || {};
                    daysOfWeek.forEach(day => {
                        const dayData = data[day] || {};
                        const schema = schemas[window.currentCategory];

                        schema.shifts.forEach((_, i) => {
                            const distEl = document.getElementById(`inp_dist_${day}_${i}`);
                            if(distEl && dayData[`dist_${i}`] !== undefined && document.activeElement !== distEl) distEl.value = dayData[`dist_${i}`];
                            setAvatar(`av_dist_${day}_${i}`, dayData[`dist_${i}_by`]);
                        });

                        schema.items.forEach(item => {
                            const itemData = (dayData.items && dayData.items[item.id]) ? dayData.items[item.id] : {};
                            
                            const planEl = document.getElementById(`inp_plan_${day}_${item.id}`);
                            if(planEl && itemData.plan !== undefined && document.activeElement !== planEl) planEl.value = itemData.plan;
                            setAvatar(`av_plan_${day}_${item.id}`, itemData.plan_by);

                            if (!item.planOnly) {
                                ['beg', 'end'].forEach(type => {
                                    const el = document.getElementById(`inp_${type}_${day}_${item.id}`);
                                    if(el && itemData[type] !== undefined && document.activeElement !== el) el.value = itemData[type];
                                    setAvatar(`av_${type}_${day}_${item.id}`, itemData[`${type}_by`]);
                                });

                                schema.shifts.forEach((_, i) => {
                                    const actEl = document.getElementById(`inp_act_${day}_${item.id}_${i}`);
                                    if(actEl && itemData[`act_${i}`] !== undefined && document.activeElement !== actEl) actEl.value = itemData[`act_${i}`];
                                    setAvatar(`av_act_${day}_${item.id}_${i}`, itemData[`act_${i}_by`]);
                                });
                            }
                        });
                        window.recalcDay(day);
                    });
                });
            } catch(e) {}
        }

        function setAvatar(id, src) {
            const el = document.getElementById(id);
            if(el) { if(src) { el.src = src; el.classList.remove('hidden'); } else { el.classList.add('hidden'); } }
        }

        function logAudit(action) {
            if(!window.currentUser) return;
            try { push(ref(db, 'audit_logs'), { time: new Date().toISOString(), user: window.currentUser.name, action: action }); } catch(e) {}

        // ==========================================
        window.uploadToImgBB = async function(input, targetInputId) {
            const file = input.files[0];
            if(!file) return;

            const statusEl = document.getElementById('uploadStatus');
            statusEl.innerText = "Uploading to ImgBB... Please wait.";
            statusEl.className = "text-xs mt-2 font-bold text-tatersOrange";
            statusEl.classList.remove('hidden');

            const formData = new FormData();
            formData.append('image', file);

            try {
                const response = await fetch('https://api.imgbb.com/1/upload?key=7724936e20f64065e89def6ec3c5a5da', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if(data.success) {
                    document.getElementById(targetInputId).value = data.data.url;
                    statusEl.innerText = "Upload successful!";
                    statusEl.classList.replace('text-tatersOrange', 'text-tatersGreen');
                } else {
                    statusEl.innerText = "Upload failed. Try another image.";
                    statusEl.classList.replace('text-tatersOrange', 'text-red-500');
                }
            } catch(e) {
                statusEl.innerText = "Error connecting to ImgBB.";
                statusEl.classList.replace('text-tatersOrange', 'text-red-500');
            }
            
            input.value = ''; 
            setTimeout(() => statusEl.classList.add('hidden'), 4000);
        };

        window.saveUser = function() {
            const oldCode = document.getElementById('editOldCode').value;
            const name = document.getElementById('uName').value.trim();
            const code = document.getElementById('uCode').value.trim();
            const role = document.getElementById('uRole').value;
            let avatar = document.getElementById('uAvatar').value.trim();

            if(!name || !code) return alert('Name and Access Code are required.');
            if(!avatar) {

                avatar = `https://api.dicebear.com/7.x/initials/svg?seed=${name}&backgroundColor=${color}`;
            }
            const userData = { name, code, role, avatar };
            if(oldCode && oldCode !== code) try { remove(ref(db, `users/${oldCode}`)); } catch(e){}
            try { set(ref(db, `users/${code}`), userData); } catch(e){}
            
            if(oldCode && oldCode !== code) delete window.systemUsers[oldCode];
            window.systemUsers[code] = userData;

        window.printToNewTab = function() {
            const rawHtml = document.getElementById('tableContainer').innerHTML;
            const printContent = `<!DOCTYPE html><html><head><title>Print - ${schemas[window.currentCategory].label}</title>
                <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

                    .day-container { margin-bottom: 30px; page-break-inside: avoid; }
                    .prod-table { width: 100%; border-collapse: collapse; text-align: center; }
                    .prod-table th, .prod-table td { border: 1px solid #000; padding: 4px; }
                    .prod-table th { font-weight: bold; text-transform: uppercase; font-size: 11px; }
                    .hdr-red, .bg-tatersRed { background-color: #d32f2f !important; color: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
                    .hdr-yellow, .bg-tatersYellow { background-color: #fbc02d !important; color: #000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
                    .hdr-green { background-color: #689f38 !important; color: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
                    .hdr-dark, .bg-gray-800 { background-color: #222 !important; color: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
                    .bg-gray-900 { background-color: #fff !important; color: #000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
                    input { display: none; }
                    .print-val { font-weight: bold; }
                    .avatar-tiny { display: none !important; }
                    .text-gray-400 { color: #555 !important; }
                </style></head><body>${rawHtml}</body></html>`;

            const printWindow = window.open('', '_blank');
            printWindow.document.write(printContent);
            const sourceInputs = document.querySelectorAll('#tableContainer input');
            const targetInputs = printWindow.document.querySelectorAll('input');
            targetInputs.forEach((targetInput, index) => {
                const val = sourceInputs[index].value;
                const span = printWindow.document.createElement('span');
                span.className = 'print-val';
                span.innerText = val ? val + (targetInput.dataset.type === 'dist' ? '%' : '') : '';
                targetInput.parentNode.replaceChild(span, targetInput);
            });
            printWindow.document.close();
            setTimeout(() => { printWindow.print(); }, 500);
        };

        window.generateTables();
    </script>
</body>
</html>
